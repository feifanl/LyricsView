<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyricify-OSS Overlay</title>
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
  </head>
  <body>
    <div id="overlay-root" class="overlay-root">
      <div id="lyrics" class="lyrics"></div>
      <div id="toast" class="toast"></div>
      <div id="edit-chrome" class="edit-chrome" hidden>
        <div class="edit-hint">Edit mode — drag to move · resize edges</div>
        <button id="edit-done" class="edit-done" title="Done">✓</button>
        <div class="grip grip-n" data-dir="North"></div>
        <div class="grip grip-s" data-dir="South"></div>
        <div class="grip grip-e" data-dir="East"></div>
        <div class="grip grip-w" data-dir="West"></div>
        <div class="grip grip-ne" data-dir="NorthEast"></div>
        <div class="grip grip-nw" data-dir="NorthWest"></div>
        <div class="grip grip-se" data-dir="SouthEast"></div>
        <div class="grip grip-sw" data-dir="SouthWest"></div>
      </div>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
